[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dms"
version = "0.1.0"
description = "Project-local durable direct messaging for existing MCP agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "49Agents contributors"}]
keywords = ["mcp", "agents", "messaging", "multi-agent", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = ["mcp==2.2.0", "httpx==0.28.1", "uvicorn==0.54.0"]

[project.urls]
Homepage = "https://github.com/49-Agents/agent-dms"
Documentation = "https://github.com/49-Agents/agent-dms/tree/main/docs"
Repository = "https://github.com/49-Agents/agent-dms"
Issues = "https://github.com/49-Agents/agent-dms/issues"
Changelog = "https://github.com/49-Agents/agent-dms/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
dev = ["build==1.3.0", "pip-tools==7.5.1", "setuptools==80.9.0", "wheel==0.48.0"]

[project.scripts]
agent-dms = "agent_dms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_dms = ["migrations/*.sql", "protocol.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
