name: focused-feature-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python scripts/validate_release.py
      - run: pytest -q tests/test_storage_identity.py tests/test_sessions_status.py
      - run: pytest -q tests/test_messages_history.py tests/test_inbox_claims.py
      - run: pytest -q tests/test_workstreams.py tests/test_mcp_integration.py
      - run: pytest -q tests/test_stdio_bridge.py tests/test_watch_receipts.py
      - run: pytest -q tests/test_cli_backup.py
      - run: python -m build --no-isolation
      - run: agent-dms --help
      - run: python scripts/validate_artifact.py
