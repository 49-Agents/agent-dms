name: publish-package

# Preparation does not publish. Dispatch only after the exact source, index,
# protected environment and owner authorization have been reviewed.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full approved main commit SHA
        required: true
        type: string
      version:
        description: Approved package version
        required: true
        default: '0.1.0'
        type: string
      target:
        description: Approved package index (TestPyPI is also public)
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require deliberate main-branch dispatch
        env:
          SOURCE_REF: ${{ github.ref }}
          ENABLED: ${{ vars.AGENT_DMS_PUBLISH_ENABLED }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          test "$ENABLED" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate exact reviewed source
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python scripts/validate_release.py --expected-commit "$EXPECTED_COMMIT" --expected-version "$EXPECTED_VERSION"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: pytest -q tests/test_mcp_integration.py tests/test_stdio_bridge.py tests/test_cli_backup.py
      - run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python -m build --no-isolation
      - run: python scripts/validate_artifact.py
      - name: Save package hashes
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
